# pnpm >=12 reads install policy from this file only.
# allowBuilds values must be booleans. An empty list is invalid, and a
# placeholder string makes every later pnpm command fail to parse this file.
packages:
  - "."

# Only these dependency lifecycle scripts may run. strictDepBuilds fails the
# install if any other package has one, instead of skipping it silently.
allowBuilds:
  # napi-postinstall: downloads the platform binding for ESLint's import resolver.
  unrs-resolver: true
  # Prints a one-time MSW setup hint. The script swallows its own failure.
  msw: true
strictDepBuilds: true

overrides:
  eslint-import-resolver-typescript: 3.10.0
  semver@^6: ^7.7.4

engineStrict: true

# Reject versions published in the last 3 days (4320 minutes).
minimumReleaseAge: 4320

# Refuse a release that lost provenance relative to the one before it.
trustPolicy: no-downgrade
trustPolicyExclude:
  # Pinned via recharts. A later release regained provenance, so this exact
  # version is the only one that trips no-downgrade.
  - "reselect@5.1.1"

# Leave blockExoticSubdeps off. minimumReleaseAge and trustPolicy can make
# pnpm report an exact registry pin as exotic. Real git/http/file swaps show
# up in the lockfile diff on a frozen install.
